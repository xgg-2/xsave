name: build

on:
  push:
    branches: [main]
    paths: ["src/**", "manifest.txt", "build.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit built file
        run: |
          git diff --quiet -- saveinstance.luau && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saveinstance.luau
          git commit -m "build: update saveinstance.luau [skip ci]"
          git push
